name: Test nimYAML

on:
  push:
    branches: [devel]
  pull_request:
  # allows running the tests manually on any branch via the Actions tab
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # so that problems in one Nim version don't stop other tests
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macOS-latest
        nim-version:
          - '2.0.x'
          - '2.2.x'
          - stable
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Cache nimble
      id: cache-nimble
      uses: actions/cache@v6
      with:
        path: ~/.nimble
        key: ${{ runner.os }}-nimble-${{ matrix.nim-version}}-${{ hashFiles('yaml.nimble') }}
        restore-keys: |
          ${{ runner.os }}-nimble-${{ matrix.nim-version}}-
    - name: Setup nim
      uses: jiro4989/setup-nim-action@v2
      with:
        nim-version: ${{ matrix.nim-version }}
        repo-token: ${{ github.token }}

    - name: Install Packages
      run: nimble install -y

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Test (C backend)
      run: nim test

    - name: Test (JS backend)
      run: nim testJS
